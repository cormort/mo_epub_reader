<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315b52"><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>版本更新日誌｜墨閱</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#24322f;background:#e9eee9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eef3ef,#f4f1ea 48%,#e8efec);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}main{width:min(820px,calc(100% - 24px));margin:auto;padding:16px 0 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.back,.check{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border:0;border-radius:12px;font:inherit;font-weight:750;text-decoration:none;cursor:pointer}.back{color:#fff;background:#315b52}.check{color:#315b52;background:#fffefa;border:1px solid #d9dfd9}.hero,.release{background:#fffefa;border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 14px 42px rgba(35,62,55,.09)}.hero{padding:24px;margin-bottom:14px}.hero h1{margin:0 0 8px;font-family:"Noto Serif TC",serif}.hero p{margin:5px 0;color:#60706b}.status{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill{padding:6px 10px;border-radius:999px;background:#f3e7d8;color:#6e4d2e;font-size:.86rem}.release{padding:20px;margin:12px 0}.release header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.release h2{margin:0;font-size:1.12rem}.version{color:#fff;background:#315b52;border-radius:999px;padding:5px 9px;font-size:.8rem}.date{color:#74817d;font-size:.86rem}.release ul{padding-left:1.25rem;line-height:1.7}.group h3{margin-bottom:4px;color:#315b52;font-size:.95rem}.empty{padding:30px;text-align:center}.foot{text-align:center;color:#74817d;font-size:.82rem;margin-top:20px}@media(max-width:520px){.top{align-items:stretch}.top>*{flex:1}.hero{padding:20px}.release{padding:17px}}</style></head><body><main><div class="top"><a class="back" href="./">← 返回閱讀器</a><button id="check" class="check" type="button">檢查更新</button></div><section class="hero"><h1>版本更新日誌</h1><p>查看墨閱最近新增、改善與修正的內容。</p><div class="status"><span id="current" class="pill">目前版本：讀取中</span><span id="build" class="pill">建置資訊：讀取中</span><span id="network" class="pill"></span></div></section><div id="releases" aria-live="polite"><div class="release empty">正在載入更新紀錄…</div></div><p class="foot">更新日誌可離線閱讀；回到網路後會自動取得最新版。</p></main><script>
const $=id=>document.getElementById(id);const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(data){$('current').textContent=`目前版本：v${data.currentVersion}`;$('releases').innerHTML=data.releases.map(r=>`<article class="release"><header><div><h2>${esc(r.title)}</h2><span class="date">${esc(r.date)}</span></div><span class="version">v${esc(r.version)}</span></header><ul>${(r.highlights||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${r.details?Object.entries(r.details).map(([k,v])=>`<section class="group"><h3>${esc(k)}</h3><ul>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join(''):''}</article>`).join('')}
async function load(){try{const [log,ver]=await Promise.all([fetch('./changelog.json',{cache:'no-store'}).then(r=>r.json()),fetch('./version.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]);render(log);$('build').textContent=ver?`建置：${String(ver.version).slice(0,7)}｜${new Date(ver.builtAt).toLocaleString('zh-TW')}`:'本機或尚未部署版本';}catch{$('releases').innerHTML='<div class="release empty">暫時無法載入更新日誌。</div>'}}
function net(){ $('network').textContent=navigator.onLine?'目前在線':'目前離線'; }net();addEventListener('online',net);addEventListener('offline',net);$('check').onclick=async()=>{const b=$('check');b.disabled=true;b.textContent='檢查中…';try{const reg=await navigator.serviceWorker?.getRegistration();await reg?.update();b.textContent=reg?.waiting?'已有更新可套用':'目前已是最新版';}catch{b.textContent='檢查失敗';}setTimeout(()=>{b.disabled=false;b.textContent='檢查更新'},2200)};load();
</script></body></html>
